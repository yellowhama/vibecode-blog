name: Weekly Content Boss

on:
  schedule:
    - cron: '0 10 * * 0' # Sunday 10:00 UTC (after weekly-report at 08:00)
  workflow_dispatch:
    inputs:
      target_week:
        description: 'Target week (e.g. 2026-w20). Leave empty for auto-detect.'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: systems/content-boss
        run: npm ci

      - name: Generate queue
        working-directory: systems/content-boss
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TARGET_WEEK: ${{ inputs.target_week || '' }}
        run: node weekly-produce.mjs

      - name: Run auto-approve
        working-directory: systems/content-boss
        run: node auto-approve.mjs || true

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet systems/twitter/queue/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            # Extract week from new file
            WEEK=$(ls -t systems/twitter/queue/*.json | head -1 | grep -oP '\d{4}-w\d{2}')
            echo "week=${WEEK}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WEEK="${{ steps.changes.outputs.week }}"
          BRANCH="content-boss/${WEEK}"

          git config user.name "content-boss[bot]"
          git config user.email "content-boss@vibecode.town"

          git checkout -b "$BRANCH"
          git add systems/twitter/queue/
          git commit -m "content: generate twitter queue ${WEEK}

          Auto-generated by Content Boss.
          Review threads and merge to approve for publishing."

          git push origin "$BRANCH"

          gh pr create \
            --title "Content: Twitter queue ${WEEK}" \
            --body "$(cat <<'EOF'
          ## Summary
          - Auto-generated twitter queue for week **${WEEK}**
          - 3 threads (Mon/Wed/Fri 14:00 UTC)
          - All items passed auto-approve validation

          ## Review Checklist
          - [ ] Thread hooks feel authentic
          - [ ] No corporate-speak leaked through
          - [ ] Story arc bridges from previous week

          🤖 Generated by Content Boss
          EOF
          )" \
            --base main
