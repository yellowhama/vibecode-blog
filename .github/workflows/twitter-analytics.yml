name: Fetch Twitter Analytics

on:
  schedule:
    - cron: '0 6 * * *'  # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-analytics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: systems/twitter/automation
        run: npm ci

      - name: Fetch engagement metrics
        working-directory: systems/twitter/automation
        env:
          API_KEY: ${{ secrets.TWITTER_API_KEY }}
          API_SECRET_KEY: ${{ secrets.TWITTER_API_SECRET_KEY }}
          ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
        run: node fetch-analytics.mjs

      - name: Generate weekly report
        run: node systems/analytics/generate-report.mjs

      - name: Build feedback context
        run: node systems/analytics/build-feedback-context.mjs

      - name: Commit analytics data
        run: |
          git config user.name "twitter-bot"
          git config user.email "twitter-bot@vibecode.town"
          git add systems/twitter/queue/analytics/ systems/analytics/reports/ systems/analytics/feedback-context.md
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore(twitter): update analytics + report [bot]"
          git pull --rebase origin main
          git push origin main
