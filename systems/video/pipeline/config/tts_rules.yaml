version: "2.0"

# ---------------------------------------------------------------------------
# Narration quality rules (from SERIES_BIBLE.md + craft-reference.md)
# Applied during TTS preprocessing as validation + auto-fix
# ---------------------------------------------------------------------------

narration:
  # WPM targets (150-180 per SERIES_BIBLE A3)
  wpm:
    target_en: 165
    min_en: 140
    max_en: 190
    # Korean uses syllable-words, speaking rate is lower in WPM but similar in syllables/min
    # Korean average speaking: ~220-280 syllables/min ≈ 80-120 WPM (space-separated)
    target_ko: 100
    min_ko: 30
    max_ko: 140

  # Key concept emphasis: 0.3s pause before important terms (SERIES_BIBLE A3)
  emphasis_pause_sec: 0.3
  emphasis_markers:
    - pattern: '\*\*([^*]+)\*\*'  # **bold** in source → pause before
      action: prefix_pause
    - pattern: '\b(핵심|key|critical|important|secret|the trick|the answer)\b'
      action: prefix_pause

  # One sentence = one idea (Kurzgesagt principle)
  max_words_per_sentence_en: 25
  max_words_per_sentence_ko: 35

  # Curse of Knowledge flags — warn if jargon without context
  jargon_watchlist_en:
    - "dependency injection"
    - "event loop"
    - "middleware"
    - "polymorphism"
    - "singleton"
    - "race condition"
    - "callback hell"
  jargon_watchlist_ko:
    - "의존성 주입"
    - "이벤트 루프"
    - "미들웨어"
    - "콜백 헬"

  # Breathing points: insert micro-pause at sentence boundaries
  # (complementary to pivot_words pauses)
  sentence_end_pause: ","
  paragraph_break_pause: "..."

  # Tone shift markers — segments where emotion changes
  tone_shift_segments:
    - { from: "MISCONCEPTION", to: "THE_CRACK", marker: "... " }
    - { from: "CORE", to: "REFRAME", marker: "... " }

pronunciation:
  # Exact match (case-sensitive)
  exact:
    "CLAUDE.md": "claude M D"
    "CLAUDE dot MD": "claude M D"
    ".cursorrules": "dot cursor rules"
    "ChatGPT": "Chat G P T"
    "OpenAI": "Open A I"
    "SSOT": "S S O T"
    "spec-kit": "spec kit"
    "LLM": "L L M"
    "API": "A P I"
    "CLI": "C L I"
    "MCP": "M C P"
    "YAML": "yaml"
    "JSON": "jason"
    "MDX": "M D X"
    "n8n": "n 8 n"
    "GPT-4": "G P T four"
    "GPT-4o": "G P T four oh"
    "AI": "A I"
  # Regex patterns
  regex:
    - pattern: '\bv(\d+)\b'
      replacement: 'version \1'
    - pattern: '\bEP(\d{2})\b'
      replacement: 'episode \1'

pauses:
  # Pause after closing quote
  after_quote_pause: "..."
  # Pivot words get a pause prefix
  pivot_words:
    - { word: "But ", prefix: "... " }
    - { word: "Because ", prefix: ", " }
    - { word: "Why?", prefix: "... " }
    - { word: "Here's the ", prefix: "... " }
    - { word: "The problem is", prefix: "... " }
    - { word: "And that's ", prefix: "... " }

# ---------------------------------------------------------------------------
# Tone validation (SERIES_BIBLE A3 We Say/Never Say + McKee Show vs Tell)
# ---------------------------------------------------------------------------
tone_validation:
  # SERIES_BIBLE A3 — 10 "Never Say" patterns (corporate/formal tone)
  never_say_patterns:
    - "이 개념을 이해하는 것이 중요합니다"
    - "보안 취약점이 감지되었습니다"
    - "코드 품질 관리가 미흡했습니다"
    - "코드 구조가 최적화되지 않았습니다"
    - "해당 가정은 사실과 달랐습니다"
    - "상당한 시간 투자 후 해결책을 발견했습니다"
    - "시스템 장애가 발생했습니다"
    - "테스트 커버리지가 부족했습니다"
    - "코드베이스 최적화를 통해"
    - "이상으로 해당 주제를 마무리하겠습니다"

  # McKee Show vs Tell — emotion words banned in action lines
  emotion_words_banned_in_action:
    - "feels"
    - "realizes"
    - "understands"
    - "knows"
    - "thinks"
    - "decides"
    - "notices"
    - "considers"

# ---------------------------------------------------------------------------
# Narrative structure rules (SKILL.md Phase 1)
# ---------------------------------------------------------------------------
narrative_structure:
  beat_map:
    min: 12
    max: 20
    max_sec: 5  # max seconds per beat
  discovery_arc_stages:
    HOOK: "Belief"
    MISCONCEPTION: "Belief"
    THE_CRACK: "Crack"
    CORE: "Mechanism+Method"
    REFRAME: "Reframe"
    OUTRO_CTA: "Action"
  shorts_candidate_min: 2

# ---------------------------------------------------------------------------
# Pre-production gates (Phase 0 + 0.5)
# ---------------------------------------------------------------------------
preproduction_gates:
  topic_card_required_sections:
    - "실패"
    - "3-5분 후"
    - "내러티브 구조"
  topic_brief_min_data_points: 5
  evaluation_min_score: 18

emotion_curves:
  HOOK:          { base: 0.6,  curve: rising,  range: [0.4, 0.7] }
  MISCONCEPTION: { base: 0.7,  curve: rising,  range: [0.5, 0.8] }
  THE_CRACK:     { base: 0.8,  curve: peak,    range: [0.5, 1.0] }
  CORE:          { base: 0.45, curve: flat,     range: [0.4, 0.5] }
  REFRAME:       { base: 0.65, curve: rising,   range: [0.5, 0.8] }
  OUTRO_CTA:     { base: 0.55, curve: falling,  range: [0.6, 0.45] }
  _default:      { base: 0.5,  curve: flat,      range: [0.5, 0.5] }

# ---------------------------------------------------------------------------
# Korean (ko) locale overrides
# ---------------------------------------------------------------------------

pronunciation_ko:
  exact:
    "LLM": "L L M"
    "API": "A P I"
    "CLI": "C L I"
    "AI": "A I"
    "MCP": "M C P"
    "YAML": "야믈"
    "JSON": "제이슨"
    "MDX": "M D X"
    "GPT-4": "G P T 포"
    "GPT-4o": "G P T 포 오"
    "ChatGPT": "챗 G P T"
    "OpenAI": "오픈 A I"
    "SSOT": "S S O T"
    "n8n": "n 8 n"
  regex:
    - pattern: '\bv(\d+)\b'
      replacement: '버전 \1'
    - pattern: '\bEP(\d{2})\b'
      replacement: '에피소드 \1'

pivot_words_ko:
  - { word: "하지만 ", prefix: "... " }
  - { word: "왜냐하면 ", prefix: ", " }
  - { word: "왜?", prefix: "... " }
  - { word: "문제는 ", prefix: "... " }
  - { word: "여기서 ", prefix: "... " }
  - { word: "그래서 ", prefix: "... " }
