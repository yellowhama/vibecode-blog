<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 160" width="100%" height="100%">
  <style>
    .font-logo {
      font-family: 'Georgia', 'Times New Roman', serif;
      font-weight: 900;
      letter-spacing: -2px;
    }
  </style>
  
  <g transform="translate(10, 10)">
    <!-- Simple Town Skyline Icon -->
    <g transform="translate(0, -5)">
      <!-- Shadow of buildings -->
      <path d="M5 45 L5 25 L20 15 L35 25 L35 45 Z" fill="#432c1c" transform="translate(4,4)"/>
      <rect x="30" y="20" width="25" height="25" fill="#432c1c" transform="translate(4,4)"/>
      <rect x="50" y="30" width="15" height="15" fill="#432c1c" transform="translate(4,4)"/>
      
      <!-- Front buildings -->
      <path d="M5 45 L5 25 L20 15 L35 25 L35 45 Z" fill="#ffa602" stroke="#432c1c" stroke-width="3" stroke-linejoin="round"/>
      <rect x="30" y="20" width="25" height="25" fill="#ffa602" stroke="#432c1c" stroke-width="3" stroke-linejoin="round"/>
      <rect x="50" y="30" width="15" height="15" fill="#ffa602" stroke="#432c1c" stroke-width="3" stroke-linejoin="round"/>
      
      <!-- Base line -->
      <line x1="0" y1="45" x2="70" y2="45" stroke="#432c1c" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- 'vibecode' shadow -->
    <text x="0" y="100" class="font-logo" font-size="64" fill="#432c1c" stroke="#432c1c" stroke-width="5" stroke-linejoin="round" transform="translate(4, 4)">vibecode</text>
    <!-- 'vibecode' front -->
    <text x="0" y="100" class="font-logo" font-size="64" fill="#ffa602" stroke="#432c1c" stroke-width="2" stroke-linejoin="round">vibecode</text>

    <!-- 'town' shadow -->
    <text x="140" y="145" class="font-logo" font-size="52" fill="#432c1c" stroke="#432c1c" stroke-width="5" stroke-linejoin="round" transform="translate(4, 4)">town</text>
    <!-- 'town' front -->
    <text x="140" y="145" class="font-logo" font-size="52" fill="#432c1c" stroke="#432c1c" stroke-width="2" stroke-linejoin="round">town</text>
  </g>
</svg>
